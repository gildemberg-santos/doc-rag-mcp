services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: doc-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # Embeddings 100% locais (opcional; só usado com EMBED_PROVIDER=ollama).
  # Após subir: docker compose exec ollama ollama pull nomic-embed-text
  # Sem ports: fala só na rede interna (evita conflito com ollama do host).
  ollama:
    image: ollama/ollama:latest
    container_name: doc-rag-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    profiles: ["ollama"]

  mcp-server:
    build: .
    container_name: doc-rag-mcp
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-docs}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nomic-embed-text}
      PROJECTS_ROOT: /projects
      HTTP_PORT: "8080"
      # Nível 2 — heartbeat do indexer --watch (volume compartilhado).
      INDEXER_STATUS_FILE: /state/indexer-status.json
      # Nível 3 — série temporal do /status (persiste no mesmo volume).
      STATUS_HISTORY_FILE: /state/history.jsonl
      # Nível 3 — socket Docker (OPT-IN, privilegiado: mesmo ":ro", o
      # container passa a falar com o daemon e enxergar outros containers;
      # o servidor só faz GET de leitura — ver internal/dockerstat).
      # Pra ativar: descomente o volume abaixo. Vazio = seção omitida.
      DOCKER_SOCKET: /var/run/docker.sock
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-}
    volumes:
      # monte seus projetos como read-only:
      - ../neurolead:/projects/neurolead:ro
      - ../neurolead-client:/projects/neurolead-client:ro
      - status_state:/state
      # Nível 3 (opt-in, ver aviso acima):
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - qdrant
    restart: unless-stopped
    command: ["--transport", "http", "--http-addr", ":8080"]

  # Indexador one-shot: docker compose run --rm indexer --all
  # Local: docker compose run --rm -e EMBED_PROVIDER=ollama indexer --all --provider ollama
  indexer:
    build: .
    entrypoint: ["mcp-indexer"]
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-docs}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nomic-embed-text}
      PROJECTS_ROOT: /projects
      INDEXER_STATUS_FILE: /state/indexer-status.json
    volumes:
      - ../neurolead:/projects/neurolead:ro
      - ../neurolead-client:/projects/neurolead-client:ro
      - ../atendimento:/projects/atendimento:ro
      - .:/projects/doc-rag-mcp:ro
      - status_state:/state
    depends_on:
      - qdrant
    profiles: ["tools"]

  # Indexador contínuo: reindexação incremental a cada REINDEX_INTERVAL,
  # com remoção automática de pontos de arquivos excluídos no mesmo ciclo.
  # Subir: docker compose --profile watch up -d indexer-watch
  indexer-watch:
    build: .
    entrypoint: ["mcp-indexer"]
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-docs}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nomic-embed-text}
      PROJECTS_ROOT: /projects
      INDEXER_STATUS_FILE: /state/indexer-status.json
    volumes:
      - ../neurolead:/projects/neurolead:ro
      - ../neurolead-client:/projects/neurolead-client:ro
      - ../atendimento:/projects/atendimento:ro
      - .:/projects/doc-rag-mcp:ro
      - status_state:/state
    depends_on:
      - qdrant
    profiles: ["watch"]
    restart: unless-stopped
    command: ["--all", "--watch", "--interval", "${REINDEX_INTERVAL:-10m}"]

volumes:
  qdrant_storage:
  ollama_data:
  status_state:
