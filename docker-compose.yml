# Ancora de logging: json-file com rotação (default do driver é ilimitado —
# um ciclo de reindex gera ~100KB de log; watch a cada 10min sem teto enche disco).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  qdrant:
    # Pin por digest (imutável; verificado ao vivo: Qdrant 1.19.2).
    # Sem rede externa o daemon não resolve tags novas — digest local sempre funciona.
    image: qdrant/qdrant@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    container_name: doc-rag-qdrant
    ports:
      - "6333:6333"
    # API key ATIVA: sem ela, todo acesso é 401 (server/indexer/docgen
    # mandam o header via QDRANT_API_KEY; dashboard pede a key no login).
    # Rotação: gere nova (openssl rand -hex 32), troque no .env e reinicie
    # toda a stack junta — key diferente entre server e clients = 401.
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    logging: *default-logging

  # Embeddings e geração 100% locais (serviço obrigatório — o provider
  # OpenAI foi removido). Após subir: docker compose exec ollama ollama pull
  # nomic-embed-text (embedding) + qwen2.5-coder:7b (docgen, se usar filedocs).
  # Sem ports: fala só na rede interna (evita conflito com ollama do host).
  # GPU: desça um `deploy.resources.reservations` com nvidia se o host tiver.
  ollama:
    # Pin por digest (imutável; verificado ao vivo: Ollama 0.35.1).
    image: ollama/ollama@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    container_name: doc-rag-ollama
    environment:
      # Modelos descarregam após 5min ociosos por default (primeira chamada
      # depois paga reload de segundos). 24h mantém quente em uso diário.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    logging: *default-logging
    # Sem curl/wget na imagem: healthcheck via a própria CLI (fala com o
    # server; exit != 0 enquanto não responde).
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  mcp-server:
    build:
      context: .
      args:
        VERSION: ${VERSION:-docker}
    container_name: doc-rag-mcp
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-docs}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nomic-embed-text}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      PROJECTS_ROOT: /projects
      HTTP_PORT: "8080"
      # Nível 2 — heartbeat do indexer --watch (volume compartilhado).
      INDEXER_STATUS_FILE: /state/indexer-status.json
      # Nível 3 — série temporal do /status (persiste no mesmo volume).
      STATUS_HISTORY_FILE: /state/history.jsonl
      # Nível 3 — socket Docker (OPT-IN, privilegiado: mesmo ":ro", o
      # container passa a falar com o daemon e enxergar outros containers;
      # o servidor só faz GET de leitura — ver internal/dockerstat).
      # Pra ativar: descomente o volume abaixo. Vazio = seção omitida.
      DOCKER_SOCKET: /var/run/docker.sock
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-}
    volumes:
      # monte seus projetos como read-only:
      - ../neurolead:/projects/neurolead:ro
      - ../neurolead-client:/projects/neurolead-client:ro
      - status_state:/state
      # Nível 3 (opt-in, ver aviso acima):
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - qdrant
      - ollama
    restart: unless-stopped
    logging: *default-logging
    command: ["--transport", "http", "--http-addr", ":8080"]

  # Indexador one-shot (incremental por padrão — só o diff):
  #  docker compose run --rm indexer --all
  # Reindex completo (só p/ migração de modelo/dims):
  #  docker compose run --rm indexer --all --clean
  # Docs geradas (coleção -filedocs, opt-in — completions têm custo):
  #  docker compose run --rm indexer --all --generate-docs
  indexer:
    build:
      context: .
      args:
        VERSION: ${VERSION:-docker}
    entrypoint: ["mcp-indexer"]
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-docs}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nomic-embed-text}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      DOCGEN_PROVIDER: ${DOCGEN_PROVIDER:-}
      DOCGEN_MODEL: ${DOCGEN_MODEL:-}
      DOCGEN_ENABLED: ${DOCGEN_ENABLED:-}
      DOCGEN_INTERVAL: ${DOCGEN_INTERVAL:-}
      DOCGEN_PROJECTS: ${DOCGEN_PROJECTS:-}
      PROJECTS_ROOT: /projects
      INDEXER_STATUS_FILE: /state/indexer-status.json
    volumes:
      - ../neurolead:/projects/neurolead:ro
      - ../neurolead-client:/projects/neurolead-client:ro
      - ../atendimento:/projects/atendimento:ro
      - .:/projects/doc-rag-mcp:ro
      - status_state:/state
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    logging: *default-logging
    profiles: ["tools"]

  # Gerador de documentação por arquivo (coleção -filedocs + .md opcional):
  #  docker compose run --rm docgen --all
  #  docker compose run --rm docgen --project neurolead --out ./docs-geradas --store=false
  docgen:
    build:
      context: .
      args:
        VERSION: ${VERSION:-docker}
    entrypoint: ["mcp-docgen"]
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-docs}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nomic-embed-text}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      DOCGEN_PROVIDER: ${DOCGEN_PROVIDER:-}
      DOCGEN_MODEL: ${DOCGEN_MODEL:-}
      PROJECTS_ROOT: /projects
    volumes:
      - ../neurolead:/projects/neurolead:ro
      - ../neurolead-client:/projects/neurolead-client:ro
      - ../atendimento:/projects/atendimento:ro
      - .:/projects/doc-rag-mcp:ro
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    logging: *default-logging
    profiles: ["tools"]

  # Indexador contínuo: reindexação incremental a cada REINDEX_INTERVAL,
  # com remoção automática de pontos de arquivos excluídos no mesmo ciclo.
  # Subir: docker compose --profile watch up -d indexer-watch
  # Docs geradas no watch (Fase 4): ligue com DOCGEN_ENABLED=true; a etapa
  # de filedocs roda no 1º ciclo e depois a cada DOCGEN_INTERVAL (default
  # 24h), só para DOCGEN_PROJECTS (csv, vazio = todos).
  indexer-watch:
    build:
      context: .
      args:
        VERSION: ${VERSION:-docker}
    entrypoint: ["mcp-indexer"]
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-docs}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nomic-embed-text}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      DOCGEN_PROVIDER: ${DOCGEN_PROVIDER:-}
      DOCGEN_MODEL: ${DOCGEN_MODEL:-}
      DOCGEN_ENABLED: ${DOCGEN_ENABLED:-}
      DOCGEN_INTERVAL: ${DOCGEN_INTERVAL:-}
      DOCGEN_PROJECTS: ${DOCGEN_PROJECTS:-}
      PROJECTS_ROOT: /projects
      INDEXER_STATUS_FILE: /state/indexer-status.json
    volumes:
      - ../neurolead:/projects/neurolead:ro
      - ../neurolead-client:/projects/neurolead-client:ro
      - ../atendimento:/projects/atendimento:ro
      - .:/projects/doc-rag-mcp:ro
      - status_state:/state
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    logging: *default-logging
    profiles: ["watch"]
    restart: unless-stopped
    command: ["--all", "--watch", "--interval", "${REINDEX_INTERVAL:-10m}"]

volumes:
  qdrant_storage:
  ollama_data:
  status_state:
